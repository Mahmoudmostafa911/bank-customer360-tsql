name: CI

# Runs the whole project on a real SQL Server 2022 (Linux container):
# 01-04 build the warehouse, then the first load, then the tests (06) and the analysis queries (05).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  SA_PASSWORD: "Ci_Passw0rd!2026"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci_Passw0rd!2026"
          MSSQL_PID: Developer
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v4

      - name: Locate the SQL Server container
        run: echo "SQL=${{ job.services.mssql.id }}" >> "$GITHUB_ENV"

      - name: Copy the scripts into the SQL Server container
        run: docker cp sql "$SQL":/sql

      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 30); do
            docker exec "$SQL" /opt/mssql-tools18/bin/sqlcmd -C -I -S localhost -U sa -P "$SA_PASSWORD" -Q "SELECT @@VERSION" && exit 0
            sleep 5
          done
          echo "SQL Server did not start in time"; exit 1

      - name: 01-04 database, sample data, warehouse tables, procedures
        run: |
          for f in 01_create_database 02_source_data 03_warehouse_tables 04_load_procedures; do
            echo "::group::$f"
            docker exec "$SQL" /opt/mssql-tools18/bin/sqlcmd -C -I -b -S localhost -U sa -P "$SA_PASSWORD" -i /sql/$f.sql
            echo "::endgroup::"
          done

      - name: First load
        run: docker exec "$SQL" /opt/mssql-tools18/bin/sqlcmd -C -I -b -S localhost -U sa -P "$SA_PASSWORD" -d BankDW -Q "EXEC dw.usp_RunLoad;"

      - name: Load log and data-quality results
        run: docker exec "$SQL" /opt/mssql-tools18/bin/sqlcmd -C -I -b -S localhost -U sa -P "$SA_PASSWORD" -d BankDW -W -Q "SET NOCOUNT ON; SELECT * FROM rpt.vw_LoadHistory; SELECT CheckName, Status, Observed FROM dw.DataQualityResult; SELECT Reason, COUNT(*) AS Rows_ FROM dw.RejectedRows GROUP BY Reason; SELECT * FROM rpt.vw_ChurnBySegment;"

      - name: 06 tests (includes the day-2 simulation)
        run: docker exec "$SQL" /opt/mssql-tools18/bin/sqlcmd -C -I -b -S localhost -U sa -P "$SA_PASSWORD" -W -i /sql/06_tests.sql

      - name: 05 analysis queries
        run: docker exec "$SQL" /opt/mssql-tools18/bin/sqlcmd -C -I -b -S localhost -U sa -P "$SA_PASSWORD" -W -i /sql/05_analysis_queries.sql | tail -n 80
